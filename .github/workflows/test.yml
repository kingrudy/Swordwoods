name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm test
      - name: Docker-image bouwen en starten
        run: |
          docker build -t swordwoods .
          docker run -d --name sw -p 8304:8304 swordwoods
          for i in $(seq 1 20); do sleep 1; curl -fsS http://localhost:8304/api/health && exit 0; done
          docker logs sw; exit 1
